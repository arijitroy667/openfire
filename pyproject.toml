[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "engbrain"
version = "0.1.0"
description = "Local-first, evidence-graded episodic memory for AI coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Arijit Roy" }]
dependencies = [
  "mcp>=2.0,<3.0",
  "pydantic>=2.7,<3.0",
  "tomlkit>=0.13,<1.0",
  "typer>=0.12,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10.0"]
llm = ["openai>=2.0,<3.0"]

[project.scripts]
engbrain = "engbrain.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/engbrain"]
include = ["src/engbrain/**/*.py", "src/engbrain/data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
